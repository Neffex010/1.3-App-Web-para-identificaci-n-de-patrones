<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Visión IA | Identificación de Patrones</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>👁️</text></svg>">
    <!-- Fuentes e Íconos -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <!-- Bootstrap 5.0 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/styles.css">
</head>
<body class="bg-light d-flex flex-column vh-100 overflow-hidden custom-font">

    <!-- Encabezado -->
    <header class="navbar navbar-dark shadow-sm p-3 header-gradient">
        <div class="container-md d-flex justify-content-between align-items-center">
            <div class="text-white d-flex align-items-center gap-2">
                <i class="bi bi-eye-fill fs-2"></i>
                <div>
                    <h1 class="h5 mb-0 fw-bold">Visión IA</h1>
                    <small class="text-white-50" style="font-size: 0.8rem;">Conteo e Identificación de Patrones</small>
                </div>
            </div>
            <div class="text-end d-flex flex-column align-items-end gap-2">
                <span class="badge bg-success rounded-pill px-3 py-1 shadow-sm"><i class="bi bi-circle-fill text-white me-1" style="font-size: 0.5rem;"></i> gpt-4o Activo</span>
                <button id="resetButton" class="btn btn-outline-light btn-sm fw-bold rounded-pill border-0 hover-opacity">
                    <i class="bi bi-arrow-counterclockwise"></i> Reiniciar
                </button>
            </div>
        </div>
    </header>

    <!-- Área Principal -->
    <main class="container-md flex-grow-1 d-flex flex-column my-3 overflow-hidden shadow-lg bg-white rounded-4 p-0 border border-light">
        
        <!-- Contenedor de Mensajes -->
        <section id="messages" class="p-4 flex-grow-1 overflow-auto bg-chat messages" aria-live="polite">
            <div class="message assistant">
                <div class="message-label"><i class="bi bi-robot"></i> IA</div>
                <div class="message-content">
                    Sube una imagen y dime qué elementos deseas que identifique y cuente.
                </div>
            </div>
        </section>

        <!-- Zona del Formulario (Modificada para adjuntar imágenes) -->
        <div class="p-3 bg-white border-top">
            
            <!-- Contenedor de previsualización de imagen -->
            <div id="imagePreviewContainer" class="d-none mb-2 px-2 position-relative d-inline-block">
                <img id="imagePreview" src="" class="img-thumbnail shadow-sm" style="max-height: 120px; border-radius: 8px;">
                <button type="button" id="removeImageBtn" class="btn btn-sm btn-danger position-absolute top-0 start-100 translate-middle rounded-circle shadow">
                    <i class="bi bi-x"></i>
                </button>
            </div>

            <form id="chatForm" class="d-flex flex-column">
                <div class="input-group input-group-lg shadow-sm rounded-pill overflow-hidden border bg-light align-items-center pe-2">
                    
                    <!-- Botón para subir imagen -->
                    <label for="imageInput" class="btn btn-light text-secondary border-0 px-4 py-2 fs-5 m-1 rounded-pill" style="cursor: pointer; transition: 0.2s;" onmouseover="this.style.backgroundColor='#e2e8f0'" onmouseout="this.style.backgroundColor='transparent'">
                        <i class="bi bi-image"></i>
                    </label>
                    <input type="file" id="imageInput" accept="image/*" class="d-none">
                    
                    <!-- Input de texto -->
                    <input
                        id="messageInput"
                        type="text"
                        class="form-control border-0 px-2 bg-light focus-ring"
                        placeholder="Ej. 'Cuenta los automóviles'..."
                        autocomplete="off"
                        required
                    >
                    
                    <!-- Botón de enviar -->
                    <button id="sendButton" type="submit" class="btn btn-primary px-4 fw-bold rounded-pill my-1 me-1 shadow-sm">
                        <i class="bi bi-send-fill"></i>
                    </button>
                </div>
            </form>
        </div>
    </main>

    <footer class="text-white text-center py-4 mt-auto header-gradient">
        <div class="container-md d-flex flex-column align-items-center gap-2">
            <small class="mb-0 text-white-50">
                Desarrollado por: <strong class="text-white">Luis Enrique Cabrera Garcia</strong> | Práctica 1.3 App Web para identificación de patrones
            </small>
            
            <a href="https://github.com/Neffex010/1.3-App-Web-para-identificaci-n-de-patrones" target="_blank" rel="noopener noreferrer" class="text-white text-decoration-none px-4 py-2 rounded-pill small github-link fw-bold">
                <i class="bi bi-github fs-6 me-2"></i>Ver código en GitHub
            </a>

            <small class="text-white-50 mt-1" style="font-size: 0.75rem;">
                © 2026 Todos los derechos reservados.
            </small>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="assets/js/app.js"></script>
</body>
</html>
